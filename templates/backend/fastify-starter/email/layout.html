<!doctype html>
<html lang="{{lang}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light"><title>{{subject}}</title></head>
<body style="margin:0;padding:0;background:#f4f5f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{preheader}}</div>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f4f5f9;"><tr><td align="center" style="padding:32px 16px;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:560px;">
<tr><td style="padding:0 4px 20px;">

<td style="width:32px;height:32px;border-radius:8px;background:{{accent}};color:#ffffff;font-size:16px;font-weight:700;text-align:center;line-height:32px;">{{initial}}</td>
<td style="padding-left:10px;font-size:16px;font-weight:700;color:#1f2330;">{{product}}</td>
</tr></table></td></tr>

{{{body}}}
</td></tr>
<tr><td style="padding:20px 4px 0;font-size:12px;line-height:18px;color:#636a7e;">{{{footer}}}</td></tr>
</table></td></tr></table>
</body></html>
