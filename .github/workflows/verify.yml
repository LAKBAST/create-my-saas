name: Verify starter templates

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    # Daily full run, so upstream drift (images, registries, browsers) shows
    # up even when nobody touches a template.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on the same pull request or branch cancels the run in
# progress. Release tags have unique refs and are never cancelled, and the
# daily run keeps its own group so a push to main cannot cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'schedule' && '-schedule' || '' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') && github.event_name != 'schedule' }}

jobs:
  changes:
    name: Detect affected jobs
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.affected.outputs.full }}
      generated_projects: ${{ steps.affected.outputs.generated_projects }}
      generated_e2e: ${{ steps.affected.outputs.generated_e2e }}
      static_site: ${{ steps.affected.outputs.static_site }}
      billing_extension: ${{ steps.affected.outputs.billing_extension }}
      fastapi: ${{ steps.affected.outputs.fastapi }}
      fastify: ${{ steps.affected.outputs.fastify }}
      nestjs: ${{ steps.affected.outputs.nestjs }}
      astro: ${{ steps.affected.outputs.astro }}
      nextjs: ${{ steps.affected.outputs.nextjs }}
      react_router: ${{ steps.affected.outputs.react_router }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: List changed files and build the job matrix
        id: affected
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          changed="$RUNNER_TEMP/changed-files.txt"
          full=false
          case "$EVENT_NAME" in
            pull_request)
              # HEAD is the merge commit, so this is exactly what the PR changes.
              git diff --name-only "$PR_BASE_SHA" HEAD > "$changed" || full=true
              ;;
            push)
              if [[ "$GITHUB_REF" == refs/tags/* || -z "$PUSH_BEFORE_SHA" || "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
                full=true
              else
                git diff --name-only "$PUSH_BEFORE_SHA" "$GITHUB_SHA" > "$changed" || full=true
              fi
              ;;
            *)
              # schedule and workflow_dispatch always run everything.
              full=true
              ;;
          esac
          if [ "$full" = true ]; then
            node .github/scripts/affected-jobs.mjs --full
          else
            node .github/scripts/affected-jobs.mjs < "$changed"
          fi

  # Always runs: it is fast, validates template READMEs and audits every
  # tracked file, so documentation-only changes are still checked.
  generator:
    name: Generator CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Audit public repository boundary
        run: npm run audit:public
      - name: Validate Community manifests
        run: npm run validate:templates
      - name: Run generator tests
        run: node --test packages/cli/test/*.test.js

  generated-projects:
    name: Generated ${{ matrix.backend }} and ${{ matrix.frontend }} starter
    needs: changes
    if: needs.changes.outputs.generated_projects != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The combinations are defined in .github/scripts/affected-jobs.mjs.
        include: ${{ fromJSON(needs.changes.outputs.generated_projects) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate selected combination
        run: >-
          node packages/cli/bin/create-my-saas.js
          "$RUNNER_TEMP/${{ matrix.backend }}-${{ matrix.frontend }}"
          --backend "${{ matrix.backend }}" --frontend "${{ matrix.frontend }}"
      - name: Verify generated metadata and proxy target
        run: |
          project="$RUNNER_TEMP/${{ matrix.backend }}-${{ matrix.frontend }}"
          test -f "$project/.create-my-saas.json"
          grep -Fx "API_PROXY_TARGET=http://localhost:${{ matrix.api_port }}" "$project/frontend/.env.example"

  generated-static-site:
    name: Generated Astro site and FastAPI API
    needs: changes
    if: needs.changes.outputs.static_site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate Astro frontend with a compatible API
        run: >-
          node packages/cli/bin/create-my-saas.js
          "$RUNNER_TEMP/astro-fastapi-site" --backend fastapi --frontend astro
      - name: Verify generated Astro project configuration
        run: |
          project="$RUNNER_TEMP/astro-fastapi-site"
          test -f "$project/.create-my-saas.json"
          grep -Fx "PUBLIC_SITE_URL=https://example.com" "$project/frontend/.env.example"
          test -f "$project/frontend/src/pages/index.astro"
          test -f "$project/backend/main.py"

  generated-billing-extension:
    name: Generated Astro Billing extension
    needs: changes
    if: needs.changes.outputs.billing_extension == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-v1-${{ runner.os }}-fastapi-astro-${{ hashFiles('templates/frontend/astro-starter/pnpm-lock.yaml', 'pnpm-lock.yaml') }}
          restore-keys: pnpm-store-v1-${{ runner.os }}-fastapi-astro-
      - name: Generate FastAPI and Astro with Community Billing
        run: >-
          node packages/cli/bin/create-my-saas.js
          "$RUNNER_TEMP/astro-billing" --backend fastapi --frontend astro --feature billing
      - name: Build the generated Billing frontend
        run: |
          project="$RUNNER_TEMP/astro-billing"
          test -f "$project/frontend/src/pages/billing/index.astro"
          grep -Fx 'PUBLIC_POSTHOG_KEY=' "$project/frontend/.env.example"
          grep -F '"id": "community:astro-billing"' "$project/.create-my-saas.json"
          cd "$project/frontend"
          pnpm install --frozen-lockfile
          pnpm run check
          pnpm run build

  generated-project-e2e:
    name: Generated ${{ matrix.backend }} + ${{ matrix.frontend }}${{ matrix.features && format(' + {0}', matrix.features) || '' }} HTTP contract E2E
    needs: changes
    if: needs.changes.outputs.generated_e2e != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The combinations are defined in .github/scripts/affected-jobs.mjs.
        include: ${{ fromJSON(needs.changes.outputs.generated_e2e) }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-v1-${{ runner.os }}-${{ matrix.backend }}-${{ matrix.frontend }}-${{ hashFiles(format('templates/backend/{0}-starter/pnpm-lock.yaml', matrix.backend), format('templates/frontend/{0}-starter/pnpm-lock.yaml', matrix.frontend), 'pnpm-lock.yaml') }}
          restore-keys: pnpm-store-v1-${{ runner.os }}-${{ matrix.backend }}-${{ matrix.frontend }}-
      # Only the FastAPI backend uses Python and uv. Enabling the uv cache in
      # a job that never creates it makes the post-job cache step fail.
      - uses: actions/setup-python@v5
        if: matrix.backend == 'fastapi'
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
        if: matrix.backend == 'fastapi'
        with:
          enable-cache: true
          cache-dependency-glob: templates/backend/fastapi-starter/uv.lock
      - name: Generate, install, boot, and exercise the HTTP contract
        run: >-
          node scripts/e2e-generated-projects.mjs
          --backend "${{ matrix.backend }}" --frontend "${{ matrix.frontend }}"
          ${{ matrix.features && format('--feature {0}', matrix.features) || '' }}

  generated-project-browser-e2e:
    name: Generated ${{ matrix.backend }} + ${{ matrix.frontend }}${{ matrix.features && format(' + {0}', matrix.features) || '' }} Playwright E2E
    needs: changes
    if: needs.changes.outputs.generated_e2e != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The combinations are defined in .github/scripts/affected-jobs.mjs.
        include: ${{ fromJSON(needs.changes.outputs.generated_e2e) }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-v1-${{ runner.os }}-${{ matrix.backend }}-${{ matrix.frontend }}-${{ hashFiles(format('templates/backend/{0}-starter/pnpm-lock.yaml', matrix.backend), format('templates/frontend/{0}-starter/pnpm-lock.yaml', matrix.frontend), 'pnpm-lock.yaml') }}
          restore-keys: pnpm-store-v1-${{ runner.os }}-${{ matrix.backend }}-${{ matrix.frontend }}-
      # Only the FastAPI backend uses Python and uv. Enabling the uv cache in
      # a job that never creates it makes the post-job cache step fail.
      - uses: actions/setup-python@v5
        if: matrix.backend == 'fastapi'
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
        if: matrix.backend == 'fastapi'
        with:
          enable-cache: true
          cache-dependency-glob: templates/backend/fastapi-starter/uv.lock
      - name: Install the Playwright test runner
        run: pnpm install --frozen-lockfile
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium and its system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      # The browser comes from the cache; the apt packages it needs do not.
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Exercise the generated project in Chromium
        run: pnpm run test:e2e:browser
        env:
          E2E_BACKEND: ${{ matrix.backend }}
          E2E_FRONTEND: ${{ matrix.frontend }}
          E2E_FEATURES: ${{ matrix.features || '' }}
      - name: Upload Playwright diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.backend }}-${{ matrix.frontend }}${{ matrix.features && format('-{0}', matrix.features) || '' }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  nestjs:
    name: NestJS starter
    needs: changes
    if: needs.changes.outputs.nestjs == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/backend/nestjs-starter
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nestjs_starter
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nestjs_starter"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nestjs_starter
      SECRET_KEY: ci-only-secret-that-is-long-enough-for-validation
      POSTGRES_INTEGRATION_TESTS: "1"
      REDIS_URL: redis://localhost:6379
      REDIS_INTEGRATION_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-v1-${{ runner.os }}-nestjs-starter-${{ hashFiles('templates/backend/nestjs-starter/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-v1-${{ runner.os }}-nestjs-starter-
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit -p tsconfig.json
      - run: pnpm run lint
      - run: node --experimental-vm-modules node_modules/jest/bin/jest.js --runInBand
      - run: pnpm run migration:run
      - run: node --experimental-vm-modules node_modules/jest/bin/jest.js --config ./test/jest-e2e.json --runInBand

  fastapi:
    name: FastAPI starter
    needs: changes
    if: needs.changes.outputs.fastapi == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/backend/fastapi-starter
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/app
      SECRET_KEY: ci-only-secret-that-is-long-enough-for-validation
      POSTGRES_INTEGRATION_TESTS: "1"
      REDIS_URL: redis://localhost:6379
      REDIS_INTEGRATION_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: templates/backend/fastapi-starter/uv.lock
      - run: uv sync --locked
      - run: uv run alembic upgrade heads
      - run: uv run python -m unittest discover -s tests

  nextjs:
    name: Next.js starter
    needs: changes
    if: needs.changes.outputs.nextjs == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/frontend/nextjs-starter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-v1-${{ runner.os }}-nextjs-starter-${{ hashFiles('templates/frontend/nextjs-starter/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-v1-${{ runner.os }}-nextjs-starter-
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run build

  react-router:
    name: React Router starter
    needs: changes
    if: needs.changes.outputs.react_router == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/frontend/react-router-starter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-v1-${{ runner.os }}-react-router-starter-${{ hashFiles('templates/frontend/react-router-starter/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-v1-${{ runner.os }}-react-router-starter-
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build

  astro:
    name: Astro starter
    needs: changes
    if: needs.changes.outputs.astro == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/frontend/astro-starter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-v1-${{ runner.os }}-astro-starter-${{ hashFiles('templates/frontend/astro-starter/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-v1-${{ runner.os }}-astro-starter-
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build

  fastify:
    name: Fastify starter
    needs: changes
    if: needs.changes.outputs.fastify == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/backend/fastify-starter
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fastify_starter
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fastify_starter"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fastify_starter
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      SECRET_KEY: ci-only-secret-that-is-long-enough-for-validation
      REDIS_URL: redis://localhost:6379
      REDIS_INTEGRATION_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-v1-${{ runner.os }}-fastify-starter-${{ hashFiles('templates/backend/fastify-starter/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-v1-${{ runner.os }}-fastify-starter-
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run db:migrate
      - run: pnpm run test
